<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Startup H</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body class="loading">

  <div id="loader">
    <video
      id="loaderVideo"
      class="loaderVideo"
      autoplay
      muted
      loop
      playsinline
      webkit-playsinline
      preload="auto"
      poster="images/background.jpg"
    >
      <source src="images/loading.mp4" type="video/mp4">
    </video>
    <div class="loaderOverlay"></div>
    <button id="tapToStart" class="tapToStart" type="button">Tap to start</button>
  </div>

  <section class="hero">
    <img class="hero__bgImage" src="images/background.jpg" alt="">

    <video
      id="heroVideo"
      class="hero__video"
      autoplay
      muted
      loop
      playsinline
      webkit-playsinline
      preload="metadata"
      poster="images/background.jpg"
    >
      <source src="images/background.mp4" type="video/mp4">
    </video>

    <div class="hero__vignette" aria-hidden="true"></div>
    <div class="hero__scanlines" aria-hidden="true"></div>

    <header class="topbar">
  <img
    src="images/logo.png"
    alt="Startup H logo"
    class="brand__logo brand--fixed"
  >

  <nav class="topnav" aria-label="Primary">
    <a href="index.html" class="topnav__link">TOP</a>
    <a href="projects.html" class="topnav__link">Projects</a>
    <a href="news.html" class="topnav__link">NEWS</a>
    <a href="company.html" class="topnav__link">Company</a>
    <a href="contact.html" class="topnav__link">Contact Us</a>
  </nav>

  <button
    id="burgerButton"
    class="burger"
    type="button"
    aria-label="メニューを開く"
    aria-expanded="false"
    aria-controls="mobileMenu"
  >
    <span></span>
    <span></span>
    <span></span>
  </button>
</header>

<div id="mobileMenu" class="mobileMenu" aria-hidden="true">
  <nav class="mobileMenu__nav" aria-label="Mobile navigation">
    <a href="index.html">TOP</a>
    <a href="projects.html">Projects</a>
    <a href="news.html">NEWS</a>
    <a href="company.html">Company</a>
    <a href="contact.html">Contact Us</a>
  </nav>
</div>

    <img class="sticker bear" src="images/bear.PNG" alt="" aria-hidden="true">
    <img class="sticker kimono" src="images/kimono.png" alt="" aria-hidden="true">
    <img class="sticker megane" src="images/megane.png" alt="" aria-hidden="true">
    <img class="sticker pc" src="images/pc.PNG" alt="" aria-hidden="true">
    <img class="sticker trash" src="images/trash.png" alt="" aria-hidden="true">
    <img class="sticker star1" src="images/star1.png" alt="" aria-hidden="true">
    <img class="sticker star2" src="images/star2.png" alt="" aria-hidden="true">
    <img class="sticker heart" src="images/heart.png" alt="" aria-hidden="true">
    <img class="sticker smile" src="images/smile.png" alt="" aria-hidden="true">

    <div class="hero__content">
      <div class="paperWrap">
        <img class="paper" src="images/paper.jpg" alt="paper">

        <img class="tape tape--tl" src="images/left.png" alt="" aria-hidden="true">
        <img class="tape tape--tr" src="images/righ2.png" alt="" aria-hidden="true">
        <img class="tape tape--bl" src="images/right1.png" alt="" aria-hidden="true">
        <img class="tape tape--br" src="images/right1.png" alt="" aria-hidden="true">

        <div class="paperText">
          <h1>
  <span class="titleBox">
    <span class="rainbowText">
      <span class="line1">中高生は、</span><span class="line2">世界を変えたい。</span>
    </span>
  </span>
</h1>

          <p>中高生が社会課題の解決策を作り、実装する。</p>
          <p>大人がそれを支援する。</p>
          <p><strong>それが Startup H。</strong></p>

          <button class="glitchBtn" type="button" onclick="goProjects()">
            <span class="glitchBtn__text" data-text="のぞいてみる">のぞいてみる</span>
            <span class="glitchBtn__icon">▶</span>
          </button>
        </div>
      </div>
    </div>

    <div class="sectionTitle" id="projects">Featured Projects</div>
  </section>

  <script>
    function goProjects(){
      document.body.classList.add("glitchFlash");
      setTimeout(() => {
        window.location.href = "projects.html";
      }, 220);
    }
    (function(){
      const loader = document.getElementById("loader");
      const loaderVideo = document.getElementById("loaderVideo");
      const heroVideo = document.getElementById("heroVideo");
      const tapBtn = document.getElementById("tapToStart");

      if (!loader || !loaderVideo) return;

      const MIN_SHOW_TIME = 1200;
      const startTime = Date.now();

      async function tryPlay(){
  const isMobile = window.matchMedia("(max-width: 820px)").matches;

  if (isMobile){
    try {
      await heroVideo?.play();
    } catch(e) {}

    return;
  }

  try {
    await loaderVideo.play();
    await heroVideo?.play();
  } catch(e) {
    tapBtn?.classList.add("show");
  }
}

      async function onTap(){
  const isMobile = window.matchMedia("(max-width: 820px)").matches;

  tapBtn?.classList.remove("show");

  if (!isMobile){
    try {
      await loaderVideo.play();
    } catch(e) {}
  }

  try {
    await heroVideo?.play();
  } catch(e) {}
}

      tapBtn?.addEventListener("click", onTap);

      window.addEventListener("load", () => {
        const elapsed = Date.now() - startTime;
        const delay = Math.max(0, MIN_SHOW_TIME - elapsed);

        setTimeout(() => {
          loader.classList.add("hidden");
          document.body.classList.remove("loading");
        }, delay);
      });

      document.addEventListener("DOMContentLoaded", tryPlay);
    })();

    const burgerButton = document.getElementById("burgerButton");
const mobileMenu = document.getElementById("mobileMenu");

function openMobileMenu(){
  burgerButton.classList.add("is-open");
  mobileMenu.classList.add("is-open");

  burgerButton.setAttribute("aria-expanded", "true");
  burgerButton.setAttribute("aria-label", "メニューを閉じる");
  mobileMenu.setAttribute("aria-hidden", "false");

  document.body.classList.add("menu-open");
}

function closeMobileMenu(){
  burgerButton.classList.remove("is-open");
  mobileMenu.classList.remove("is-open");

  burgerButton.setAttribute("aria-expanded", "false");
  burgerButton.setAttribute("aria-label", "メニューを開く");
  mobileMenu.setAttribute("aria-hidden", "true");

  document.body.classList.remove("menu-open");
}

burgerButton?.addEventListener("click", () => {
  const isOpen = mobileMenu.classList.contains("is-open");

  if (isOpen){
    closeMobileMenu();
  } else {
    openMobileMenu();
  }
});

mobileMenu?.addEventListener("click", (event) => {
  if (
    event.target === mobileMenu ||
    event.target.closest("a")
  ){
    closeMobileMenu();
  }
});

/* Close with Escape */
document.addEventListener("keydown", (event) => {
  if (event.key === "Escape"){
    closeMobileMenu();
  }
});
  </script>
</body>
</html>
